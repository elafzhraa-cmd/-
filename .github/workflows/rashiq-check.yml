name: Check RASH.IQ
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check rashiq/data.js
          node --check rashiq/app.js
          node --check rashiq/sw.js
      - name: Check manifest JSON
        run: python -m json.tool rashiq/manifest.webmanifest > /dev/null
      - name: Check required app files
        run: |
          test -s rashiq/index.html
          test -s rashiq/style.css
          test -s rashiq/v2.css
          test -s rashiq/data.js
          test -s rashiq/app.js
          test -s rashiq/icon.svg
          test -s rashiq/icon-192.svg
          test -s rashiq/icon-512.svg
          test -s rashiq/manifest.webmanifest
          test -s rashiq/sw.js
          test -s rashiq/version.txt
      - name: Check v2 wiring
        run: |
          grep -q 'leaflet.markercluster@1.4.1' rashiq/index.html
          grep -q 'v2.css' rashiq/index.html
          grep -q 'data.js' rashiq/index.html
          grep -q 'RASH.IQ v2.0.0' rashiq/version.txt
